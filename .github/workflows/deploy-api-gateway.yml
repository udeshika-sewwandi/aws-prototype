name: Deploy API Gateway

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Debug OIDC token
      #   run: |
      #     curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #       "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | \
      #       cut -d '.' -f2 | base64 -d 2>/dev/null | python3 -m json.tool
      #   env:
      #     ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
      #     ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::048834124872:role/GitHubActionsApiGatewayRole
          aws-region: us-east-1

      - name: Validate CloudFormation
        run: |
          aws cloudformation validate-template \
            --template-body file://frontend/cloudformation/api-gateway.yaml

      - name: Validate session
        run: |
          aws sts get-caller-identity

      - name: Deploy API Gateway
        run: |
          aws cloudformation deploy \
            --template-file frontend/cloudformation/api-gateway.yaml \
            --stack-name my-api-gateway-dev \
            --parameter-overrides \
              LambdaFunctionArn=arn:aws:lambda:us-east-1:048834124872:function:prototype-api \
              CognitoUserPoolId=us-east-1_VgAKe8nT0 \
              CognitoAppClientId=4lcp7epkr196tgh9d5ml4esrm5 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
